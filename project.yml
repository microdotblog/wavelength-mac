name: Wavelength
options:
  bundleIdPrefix: blog.micro
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 3F9MDJ6K4E
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  LAME:
    path: Packages/LAME
  MMMarkdown:
    path: Packages/MMMarkdown
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
targets:
  Wavelength:
    type: application
    platform: macOS
    sources:
      - Wavelength
    dependencies:
      - package: LAME
      - package: MMMarkdown
      - package: Sparkle
    entitlements:
      path: Wavelength/Resources/Wavelength.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spks"
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spki"
    info:
      path: Wavelength/Resources/Info.plist
      properties:
        CFBundleDisplayName: Wavelength
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: Allow Wavelength to record podcasts.
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUFeedURL: "$(WAVELENGTH_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(WAVELENGTH_UPDATE_PUBLIC_KEY)"
        CFBundleURLTypes:
          - CFBundleURLName: blog.micro.wavelength
            CFBundleURLSchemes:
              - wavelength
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blog.micro.wavelength
        PRODUCT_NAME: Wavelength
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        WAVELENGTH_UPDATE_FEED_URL: "https://s3.amazonaws.com/micro.blog/mac/wavelength.xml"
        WAVELENGTH_UPDATE_PUBLIC_KEY: "x55S7vFMvOyNyuuDlHqJOJfykdeAeF2rjBp1i8Iz8/c="
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SELECTED_FILES: readwrite
        GENERATE_INFOPLIST_FILE: NO
  WavelengthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - WavelengthTests
    dependencies:
      - target: Wavelength
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: blog.micro.wavelength.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wavelength.app/Contents/MacOS/Wavelength"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Wavelength:
    build:
      targets:
        Wavelength: all
        WavelengthTests: [test]
    test:
      targets:
        - WavelengthTests
